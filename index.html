<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>名工銘鈑株式会社 | 鯉をタップしてご連絡</title>
<meta name="description" content="名工銘鈑株式会社のデジタル名刺。池を泳ぐ鯉をタップすると、ホームページ・電話・メールにつながります。">
<meta name="theme-color" content="#020f1f">
<style>
:root{--ink:#16222c}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#020f1f;overflow:hidden;color:#fff;
  font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;-webkit-text-size-adjust:100%}
#pond{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:default;-webkit-tap-highlight-color:transparent}
#pond.hover{cursor:pointer}
a:focus-visible,summary:focus-visible{outline:3px solid #ffe08a;outline-offset:3px}

/* ===== 銘板(金属プレート)===== */
.plate{--b1:#f4f6f8;--b2:#c3ccd3;--b3:#e8ecef;--b4:#a9b3bb;--ink:#16222c;--edge:rgba(70,82,92,.9);
  position:relative;color:var(--ink);border-radius:7px;border:1px solid var(--edge);
  background:
    linear-gradient(105deg,transparent 42%,rgba(255,255,255,.75) 50%,transparent 58%) 140% 0/260% 100% no-repeat,
    repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 1px,rgba(0,0,0,.045) 1px 2px),
    linear-gradient(135deg,var(--b1) 0%,var(--b2) 28%,var(--b3) 47%,var(--b4) 72%,var(--b3) 100%);
  box-shadow:0 10px 26px rgba(0,0,0,.55),inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.3),inset 0 0 0 3px rgba(255,255,255,.16);
  animation:sheen 7s linear infinite;text-shadow:0 1px 0 rgba(255,255,255,.85),0 -1px 0 rgba(0,0,0,.15)}
.plate::before,.plate::after{content:"";position:absolute;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;
  background:linear-gradient(45deg,transparent 44%,rgba(0,0,0,.6) 44% 56%,transparent 56%),
             radial-gradient(circle at 35% 30%,#fff,#9aa5ae 60%,#5e6a73);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.45),0 1px 1px rgba(0,0,0,.3)}
.plate::before{left:7px}.plate::after{right:7px}
.plate.gold{--b1:#fff3c9;--b2:#d6a53a;--b3:#f8e3a4;--b4:#b3831f;--ink:#3a2706;--edge:rgba(120,80,10,.9)}
.plate.blue{--b1:#58b4ee;--b2:#0b7dbf;--b3:#3a9cd8;--b4:#06578a;--ink:#fff;--edge:rgba(2,50,90,.9);text-shadow:0 1px 0 rgba(0,0,0,.4)}
@keyframes sheen{0%{background-position:140% 0,0 0,0 0}55%,100%{background-position:-60% 0,0 0,0 0}}

/* 鯉についてくる名札(本物のリンクです) */
#tags{position:fixed;inset:0;pointer-events:none;z-index:2}
.tag{position:absolute;left:0;top:0;pointer-events:auto;will-change:transform;text-decoration:none;text-align:center;
  padding:7px 25px;font-weight:800;letter-spacing:.04em;line-height:1.25;white-space:nowrap;opacity:0;transition:opacity 1.2s,filter .2s}
.tag.on{opacity:1}
.tag .l{display:block;font-size:15px}
.tag small{display:block;font-size:11.5px;font-weight:600;letter-spacing:.02em;opacity:.9}
.tag:hover,.tag:focus-visible{filter:brightness(1.1) saturate(1.1)}

/* 会社の銘板(ヘッダー) */
.head{position:fixed;z-index:3;left:max(16px,env(safe-area-inset-left));top:max(16px,env(safe-area-inset-top));
  display:flex;align-items:center;gap:12px;max-width:min(88vw,430px);padding:11px 30px 11px 26px;animation:drop 1.3s .15s cubic-bezier(.2,.8,.2,1) both,sheen 7s linear infinite}
.head .logo{flex:none;width:40px;height:40px;filter:drop-shadow(0 1px 0 rgba(255,255,255,.8))}
.head h1{margin:0;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:21px;line-height:1.25;letter-spacing:.07em;font-weight:800}
.head .ro{font-size:10.5px;letter-spacing:.3em;font-weight:700;color:#0b6eaa;margin-top:1px}
.head p{margin:3px 0 0;font-size:12.5px;font-weight:600}
@keyframes drop{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}

.hint{position:fixed;z-index:3;left:50%;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 52px);transform:translateX(-50%);white-space:nowrap;
  padding:8px 20px;border-radius:999px;background:rgba(3,20,36,.6);border:1px solid rgba(255,214,120,.7);color:#ffe9b0;
  font-size:13px;font-weight:700;letter-spacing:.04em;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 0 18px rgba(255,200,90,.25);animation:pulse 2.4s ease-in-out infinite;transition:opacity 1s;pointer-events:none}
.hint.off{opacity:0;animation:none}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.05)}}

details.list{position:fixed;z-index:3;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px)}
details.list summary{list-style:none;cursor:pointer;margin:0 auto;width:max-content;padding:7px 24px;border-radius:999px;
  background:rgba(3,20,36,.62);border:1px solid rgba(255,255,255,.4);font-size:13px;font-weight:700;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
details.list summary::-webkit-details-marker{display:none}
details.list ul{list-style:none;margin:0 0 8px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  position:absolute;left:50%;bottom:100%;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);
  border-radius:16px;background:rgba(3,20,36,.78);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
details.list a{display:block;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;text-decoration:none;font-size:14px;font-weight:700}
details.list a:hover{background:rgba(255,255,255,.28)}

@media (max-width:480px){.tag{padding:6px 22px}.tag .l{font-size:13.5px}.tag small{font-size:11px}
  .head{padding:9px 24px 9px 22px;gap:10px}.head h1{font-size:18px}.head .logo{width:34px;height:34px}.head p{font-size:11.5px}}
@media (prefers-reduced-motion:reduce){.plate,.head,.hint{animation:none}}
</style>
</head>
<body>
<canvas id="pond" role="img" aria-label="夜の池を泳ぐ5匹の鯉。鯉をタップすると、それぞれのリンク先に移動します。水面をタップすると餌をまけます。"></canvas>
<div id="tags"></div>

<header class="plate head">
  <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><polygon points="24,3.5 42.5,14 42.5,34 24,44.5 5.5,34 5.5,14" fill="none" stroke="#0b6eaa" stroke-width="3.6" stroke-linejoin="round"/><path d="M14.5 33V16.5l9.5 9.5 9.5-9.5V33" fill="none" stroke="#0b6eaa" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
  <div>
    <h1 id="siteName"></h1>
    <div class="ro" id="siteRo"></div>
    <p id="siteTag"></p>
  </div>
</header>
<div class="hint" id="hint"></div>
<details class="list"><summary>リンク一覧</summary><ul id="linkList"></ul></details>

<script>
'use strict';
/* =====================================================================
   ★ ここだけ書き換えれば、自分用のページになります ★
   ===================================================================== */
const SITE = {
  name:    "名工銘鈑株式会社",                       // 左上の銘板に出る会社名
  romaji:  "MEIHAN MEIKO",                          // 会社名の下の英字
  tagline: "鯉をタップして、ご連絡ください",         // 一言(お名前や部署を入れてもOK)
  hint:    "鯉をタップ ・ 水面をタップで餌やり"       // 画面下の案内(数秒で消えます)
};

/* 鯉は5匹です。 type は鯉の種類:
     kohaku(紅白) / sanke(大正三色) / ogon(黄金) / tancho(丹頂) / asagi(浅黄・青)
   label = 名札の文字 / note = 名札の小さい文字
   url   = タップしたときの行き先
          ホームページ …… "https://example.com/"
          電話         …… "tel:+81312345678"(ハイフンなし・先頭の0を外して+81)
          メール       …… "mailto:info@example.com"
   newTab: true にすると、新しいタブで開きます
   image : AIで作った鯉の画像(PNG・背景透明・真上から見た絵で、頭が右向き)を使う場合に、画像のパスを書く
           例)image: "koi/kohaku.png"   ※書かなければ、内蔵の鯉が泳ぎます                         */
const FISH = [
  { type:"kohaku", label:"ホームページ", note:"公式サイトを見る", url:"https://www.meiko-meihan.co.jp/", newTab:true },
  { type:"ogon",   label:"お電話",       note:"03-1234-5678",     url:"tel:+81312345678", tone:"gold" },
  { type:"sanke",  label:"メール",       note:"お問い合わせ",     url:"mailto:info@example.com" },
  { type:"tancho", label:"ECサイト",     note:"詳しく見る",       url:"https://mokuzakka.theshop.jp/" },
  { type:"asagi",  label:"Instagram",    note:"最新情報はこちら", url:"https://www.instagram.com/meiko_m1958/", tone:"blue" }
];
/* ===================== ここから下は、変更しなくて大丈夫です ===================== */

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOTION = REDUCED ? .45 : 1;
const cv = document.getElementById('pond'), cx = cv.getContext('2d');
let W=0, H=0, DPR=1, S=1, lowQ=false;
const rand=Math.random, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), TAU=Math.PI*2;
const lerp=(a,b,f)=>a+(b-a)*f;
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const angDiff=(a,b)=>{ let d=a-b; while(d>Math.PI)d-=TAU; while(d<-Math.PI)d+=TAU; return d; };

/* ---------- 鯉の種類 ---------- */
const KOI={
  kohaku:{L:190,W:.105,speed:42,glow:'#ffe2a0',base:'#f6f1e6',fin:'246,241,230'},
  sanke: {L:180,W:.105,speed:46,glow:'#ffe2a0',base:'#f5f0e6',fin:'245,240,230'},
  ogon:  {L:186,W:.105,speed:50,glow:'#ffd75a',base:'#d9a030',fin:'242,192,84'},
  tancho:{L:166,W:.100,speed:48,glow:'#ffe2a0',base:'#f7f3ec',fin:'247,243,236'},
  asagi: {L:160,W:.100,speed:54,glow:'#9fd8ff',base:'#456f9c',fin:'112,162,208'}
};
const ALIAS={koi:'kohaku',betta:'kohaku',clown:'sanke',angel:'tancho',tetra:'asagi'};
const NSEG=16;

/* ---------- 鯉のからだ(背骨を追いかける形) ---------- */
function geom(k){
  const L=k.L, Wm=L*KOI[k.type].W, A=L*.055*(1+k.boost*.5), ph=k.phase, g={q:[],n:[],t:[],w:[],Wm,L,N:NSEG};
  for(let i=0;i<=NSEG;i++){
    const a=k.pts[Math.max(0,i-1)], b=k.pts[Math.min(NSEG,i+1)];
    let tx=a.x-b.x, ty=a.y-b.y; const m=Math.hypot(tx,ty)||1; tx/=m; ty/=m;
    const s=i/NSEG, nx=-ty, ny=tx, off=A*(.12+.88*Math.pow(s,1.4))*Math.sin(ph-s*5);
    g.q.push({x:k.pts[i].x+nx*off,y:k.pts[i].y+ny*off}); g.n.push({x:nx,y:ny}); g.t.push({x:tx,y:ty});
    g.w.push(Wm*(Math.pow(Math.sin(Math.PI*(.12+.88*Math.pow(s,.8))),.9)*(1-.5*s)+.1*s));
  }
  return g;
}
function at(g,s,d){
  const idx=clamp(s,0,1)*g.N, i=Math.min(g.N-1,Math.floor(idx)), f=idx-i, q0=g.q[i],q1=g.q[i+1],n0=g.n[i],n1=g.n[i+1],t0=g.t[i],t1=g.t[i+1];
  const w=lerp(g.w[i],g.w[i+1],f), nx=lerp(n0.x,n1.x,f), ny=lerp(n0.y,n1.y,f), tx=lerp(t0.x,t1.x,f), ty=lerp(t0.y,t1.y,f);
  return { x:lerp(q0.x,q1.x,f)+nx*d*w, y:lerp(q0.y,q1.y,f)+ny*d*w, nx,ny,tx,ty,w };
}
function bodyPath(g){
  const q=g.q,n=g.n,w=g.w,t=g.t,N=g.N; cx.beginPath();
  cx.moveTo(q[0].x-n[0].x*w[0], q[0].y-n[0].y*w[0]);
  cx.quadraticCurveTo(q[0].x+t[0].x*w[0]*2, q[0].y+t[0].y*w[0]*2, q[0].x+n[0].x*w[0], q[0].y+n[0].y*w[0]);
  for(let i=1;i<=N;i++) cx.lineTo(q[i].x+n[i].x*w[i], q[i].y+n[i].y*w[i]);
  for(let i=N;i>=1;i--) cx.lineTo(q[i].x-n[i].x*w[i], q[i].y-n[i].y*w[i]);
  cx.closePath();
}
function tailFin(g,k,sp){
  const N=g.N, L=g.L, B=g.q[N], D=Math.atan2(-g.t[N].y,-g.t[N].x), Lt=L*.36, Sp=L*.2, flex=Math.sin(k.phase-5.4)*.55, m=18, a=[], b=[];
  for(let i=0;i<=m;i++){ const s=i/m, ang=D+flex*s*s+Math.sin(k.phase*1.3-s*5)*.12*s, dx=Math.cos(ang), dy=Math.sin(ang), px=-dy, py=dx,
    cxp=B.x+dx*Lt*s, cyp=B.y+dy*Lt*s, w=Sp*(.1+.9*Math.pow(s,.7))*(1-.2*s*s*s);
    a.push([cxp+px*w,cyp+py*w]); b.push([cxp-px*w,cyp-py*w]); }
  cx.beginPath(); cx.moveTo(B.x,B.y); a.forEach(p=>cx.lineTo(p[0],p[1]));
  const tip=[(a[m][0]+b[m][0])/2-Math.cos(D)*Lt*.16,(a[m][1]+b[m][1])/2-Math.sin(D)*Lt*.16]; cx.lineTo(tip[0],tip[1]);
  for(let i=m;i>=0;i--) cx.lineTo(b[i][0],b[i][1]); cx.closePath();
  const gr=cx.createLinearGradient(B.x,B.y,B.x+Math.cos(D)*Lt,B.y+Math.sin(D)*Lt);
  gr.addColorStop(0,'rgba('+sp.fin+',.95)'); gr.addColorStop(1,'rgba('+sp.fin+',.14)'); cx.fillStyle=gr; cx.fill();
  cx.strokeStyle='rgba(0,40,80,.16)'; cx.lineWidth=1;
  for(let i=1;i<m;i+=3){ cx.beginPath(); cx.moveTo(B.x,B.y); cx.lineTo(a[i][0],a[i][1]); cx.stroke(); cx.beginPath(); cx.moveTo(B.x,B.y); cx.lineTo(b[i][0],b[i][1]); cx.stroke(); }
}
function sideFin(g,k,sp,s,dd,len,alpha0,sideSign){
  const B=at(g,s,dd*sideSign), a=alpha0+.3*Math.sin(k.phase*1.4+sideSign), L=g.L*len;
  let dx=-B.tx*Math.cos(a)+B.nx*sideSign*Math.sin(a), dy=-B.ty*Math.cos(a)+B.ny*sideSign*Math.sin(a); const m=Math.hypot(dx,dy)||1; dx/=m; dy/=m;
  const px=-dy*sideSign, py=dx*sideSign, T={x:B.x+dx*L,y:B.y+dy*L};
  cx.beginPath(); cx.moveTo(B.x,B.y);
  cx.quadraticCurveTo(B.x+dx*L*.55+px*L*.3,B.y+dy*L*.55+py*L*.3,T.x,T.y);
  cx.quadraticCurveTo(B.x+dx*L*.35-px*L*.2,B.y+dy*L*.35-py*L*.2,B.x,B.y);
  const gr=cx.createLinearGradient(B.x,B.y,T.x,T.y); gr.addColorStop(0,'rgba('+sp.fin+',.92)'); gr.addColorStop(1,'rgba('+sp.fin+',.12)');
  cx.fillStyle=gr; cx.fill();
}
function patch(g,s,d,rs,rw,col){
  const p=at(g,s,d), ang=Math.atan2(p.ty,p.tx);
  cx.save(); cx.translate(p.x,p.y); cx.rotate(ang);
  cx.beginPath(); cx.ellipse(0,0,rs*g.L*1.12,rw*p.w*1.1,0,0,TAU); cx.fillStyle=col; cx.globalAlpha=.35; cx.fill();
  cx.beginPath(); cx.ellipse(0,0,rs*g.L,rw*p.w,0,0,TAU); cx.globalAlpha=1; cx.fillStyle=col; cx.fill(); cx.restore();
}
const RED='#e22f1b', RED2='#ee4a1c', SUMI='#15151b';
const PATTERN={
  kohaku(g){ patch(g,.2,0,.075,1.2,RED); patch(g,.36,-.08,.085,1.25,RED); patch(g,.56,.18,.075,1.1,RED); patch(g,.72,-.28,.055,.8,RED); },
  sanke(g){ patch(g,.18,0,.07,1.2,RED2); patch(g,.4,.05,.085,1.2,RED2); patch(g,.6,-.15,.07,1.0,RED2);
    patch(g,.3,.55,.02,.28,SUMI); patch(g,.5,-.55,.025,.3,SUMI); patch(g,.68,.3,.02,.26,SUMI); patch(g,.82,-.2,.016,.2,SUMI);
    [-1,1].forEach(sd=>patch(g,.22,sd*.9,.035,.3,SUMI)); },
  ogon(){}, 
  tancho(g){ const p=at(g,.1,0); cx.beginPath(); cx.arc(p.x,p.y,g.L*.046,0,TAU); cx.fillStyle='#e0201a'; cx.fill();
    cx.beginPath(); cx.arc(p.x-g.L*.01,p.y-g.L*.012,g.L*.014,0,TAU); cx.fillStyle='rgba(255,255,255,.35)'; cx.fill(); },
  asagi(g){ patch(g,.1,0,.06,1.1,'#d4e3ef'); [-1,1].forEach(sd=>{ patch(g,.3,sd*.78,.1,.45,'#e8561f'); patch(g,.48,sd*.8,.085,.4,'#ee6a2a'); patch(g,.66,sd*.75,.05,.3,'#ee6a2a'); }); }
};
function scales(g,k){
  cx.beginPath(); const rows=[-.74,-.37,0,.37,.74];
  rows.forEach((d,ri)=>{ for(let s=.1;s<.97;s+=.062){ const p=at(g,s+(ri%2?.031:0),d), ang=Math.atan2(-p.ty,-p.tx), r=Math.max(2.4,p.w*.21);
    cx.moveTo(p.x+Math.cos(ang-1)*r,p.y+Math.sin(ang-1)*r); cx.arc(p.x,p.y,r,ang-1,ang+1); } });
  cx.strokeStyle = k.type==='asagi' ? 'rgba(8,28,70,.5)' : k.type==='ogon' ? 'rgba(150,85,8,.38)' : 'rgba(120,92,64,.17)';
  cx.lineWidth = k.type==='asagi' ? 1.3 : 1; cx.stroke();
}
function sheen(g,k,t){
  cx.beginPath(); for(let i=1;i<=NSEG-2;i++){ const p=g.q[i]; i===1?cx.moveTo(p.x,p.y):cx.lineTo(p.x,p.y); }
  cx.strokeStyle = k.type==='ogon' ? 'rgba(255,244,190,.5)' : 'rgba(255,255,255,.22)'; cx.lineWidth=g.Wm*.85; cx.lineCap='round'; cx.lineJoin='round'; cx.stroke();
  bodyPath(g); cx.strokeStyle='rgba(0,30,60,.20)'; cx.lineWidth=g.Wm*.55; cx.stroke();
  if(k.type==='ogon'||k.type==='asagi'){
    const s0=((t*.2*MOTION+k.seed)%1.5)-.25, p=at(g,clamp(s0,0,1),0);
    cx.save(); cx.translate(p.x,p.y); cx.rotate(Math.atan2(p.ty,p.tx)); cx.beginPath(); cx.ellipse(0,0,g.L*.05,p.w*1.3,0,0,TAU);
    cx.fillStyle = k.type==='ogon' ? 'rgba(255,250,215,.55)' : 'rgba(210,235,255,.3)'; cx.fill(); cx.restore();
  }
}
function face(g,k){
  [-1,1].forEach(sd=>{ const p=at(g,.095,sd*.88), r=Math.max(2.2,g.L*.0125);
    cx.beginPath(); cx.arc(p.x,p.y,r*1.25,0,TAU); cx.fillStyle='rgba(15,20,26,.55)'; cx.fill();
    cx.beginPath(); cx.arc(p.x,p.y,r,0,TAU); cx.fillStyle='#07090c'; cx.fill();
    cx.beginPath(); cx.arc(p.x-r*.3,p.y-r*.3,r*.32,0,TAU); cx.fillStyle='#fff'; cx.fill(); });
  const q=g.q[0], t=g.t[0], n=g.n[0], w=g.w[0];
  cx.strokeStyle='rgba('+KOI[k.type].fin+',.85)'; cx.lineWidth=1.3; cx.lineCap='round';
  [-1,1].forEach(sd=>{ cx.beginPath(); cx.moveTo(q.x+t.x*w*1.5+n.x*sd*w*.4,q.y+t.y*w*1.5+n.y*sd*w*.4);
    cx.quadraticCurveTo(q.x+t.x*w*2.1+n.x*sd*w*1.2,q.y+t.y*w*2.1+n.y*sd*w*1.2,q.x+t.x*w*1.9+n.x*sd*w*1.9,q.y+t.y*w*1.9+n.y*sd*w*1.9); cx.stroke(); });
}
function drawKoi(k,t){
  const sp=KOI[k.type], g=geom(k); k.g=g;
  cx.save(); cx.globalAlpha=k.alpha;
  cx.save(); cx.translate(7*S,13*S); bodyPath(g); cx.fillStyle='rgba(0,8,20,.30)'; cx.fill(); cx.restore();
  if(k.img){

function drawSparks(dt){
  cx.save(); cx.globalCompositeOperation='lighter';
  for(let i=sparks.length-1;i>=0;i--){ const s=sparks[i]; s.life-=dt; if(s.life<=0){sparks.splice(i,1);continue;} s.x+=s.vx*dt; s.y+=s.vy*dt; s.vx*=.96; s.vy*=.96;
    const a=s.life/s.max, g=cx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*3.5); g.addColorStop(0,'rgba('+s.c+','+a+')'); g.addColorStop(1,'rgba('+s.c+',0)'); cx.fillStyle=g; cx.fillRect(s.x-s.r*3.5,s.y-s.r*3.5,s.r*7,s.r*7); }
  cx.restore();
}

/* ---------- 名札(銘板)の配置 ---------- */
const tagsEl=document.getElementById('tags'), headEl=document.querySelector('.head');
function buildTags(){
  tagsEl.innerHTML=''; const ul=document.getElementById('linkList'); ul.innerHTML='';
  fishes.forEach(k=>{ const d=k.d, a=document.createElement('a'); a.className='plate tag'+(d.tone?' '+d.tone:(k.type==='ogon'?' gold':'')); a.href=d.url;
    if(d.newTab){ a.target='_blank'; a.rel='noopener'; }
    a.innerHTML='<span class="l"></span><small></small>'; a.firstChild.textContent=d.label; a.lastChild.textContent=d.note||''; if(!d.note) a.lastChild.remove();
    tagsEl.appendChild(a); k.tag=a;
    const li=document.createElement('li'), b=document.createElement('a'); b.href=d.url; b.textContent=d.label; if(d.newTab){ b.target='_blank'; b.rel='noopener'; } li.appendChild(b); ul.appendChild(li); });
  setTimeout(()=>fishes.forEach(k=>k.tag.classList.add('on')),1100);
}
function placeTags(dt){
  const ir=headEl.getBoundingClientRect(), placed=[{x:ir.left,y:ir.top,w:ir.width,h:ir.height+6}];
  const items=fishes.map(k=>{ const w=k.tag.offsetWidth||110, h=k.tag.offsetHeight||44, hx=k.x, hy=k.y;
    return { k, w, h, x:clamp(hx-w/2,8,W-w-8), y:hy-Math.max(k.L*.2,26*S)-h-6 }; }).sort((a,b)=>a.y-b.y);
  items.forEach(it=>{
    for(let n=0;n<10;n++){ const hit=placed.find(p=>it.x<p.x+p.w+6&&it.x+it.w+6>p.x&&it.y<p.y+p.h+6&&it.y+it.h+6>p.y); if(!hit) break; it.y=hit.y+hit.h+6; }
    it.y=clamp(it.y,8,H-it.h-60); placed.push({x:it.x,y:it.y,w:it.w,h:it.h});
    const k=it.k, f=1-Math.exp(-dt*8); if(k.tx0===undefined){k.tx0=it.x;k.ty0=it.y;} k.tx0+=(it.x-k.tx0)*f; k.ty0+=(it.y-k.ty0)*f;
    k.tag.style.transform='translate3d('+Math.round(k.tx0)+'px,'+Math.round(k.ty0)+'px,0)'; });
}

/* ---------- 操作 ---------- */
let navigating=false, now=0, mx=0, my=0, pxs=0, pys=0;
function hitFish(x,y){ let best=null,bd=1e9; fishes.forEach(k=>{ if(!k.g) return; for(let i=0;i<=NSEG;i+=1){ const q=k.g.q[i], d=Math.hypot(x-q.x,y-q.y), lim=k.g.w[i]*1.5+14; if(d<lim&&d<bd){bd=d;best=k;} } }); return best; }
function go(k){
  if(navigating) return; navigating=true; k.boost=1; burst(k.x,k.y,26,'255,225,130'); addRipple(k.x,k.y,110*S,.6,'255,230,160');
  const url=k.d.url;
  if(k.d.newTab){ window.open(url,'_blank','noopener'); setTimeout(()=>{navigating=false;},700); }
  else setTimeout(()=>{ location.href=url; setTimeout(()=>{navigating=false;},1500); },420);
}
const hint=document.getElementById('hint');
cv.addEventListener('pointerdown',e=>{
  const k=hitFish(e.clientX,e.clientY); hint.classList.add('off');
  if(k) go(k);
  else { addRipple(e.clientX,e.clientY,90*S,.55); addRipple(e.clientX,e.clientY,50*S,.4,'255,230,160'); for(let i=0;i<3;i++) foods.push({x:e.clientX+(rand()-.5)*36*S,y:e.clientY+(rand()-.5)*36*S,age:0,ph:rand()*6}); if(foods.length>14) foods.splice(0,foods.length-14); }
});
cv.addEventListener('pointermove',e=>{ mx=e.clientX/W*2-1; my=e.clientY/H*2-1; if(e.pointerType==='touch') return;
  const k=hitFish(e.clientX,e.clientY); fishes.forEach(g=>g.hover=(g===k)); cv.classList.toggle('hover',!!k); });
cv.addEventListener('pointerleave',()=>{ fishes.forEach(g=>g.hover=false); cv.classList.remove('hover'); });
addEventListener('pageshow',()=>{ navigating=false; });

/* ---------- 画面の準備と、毎コマの更新 ---------- */
document.getElementById('siteName').textContent=SITE.name;
document.getElementById('siteRo').textContent=SITE.romaji||'';
document.getElementById('siteTag').textContent=SITE.tagline;
hint.textContent=SITE.hint; setTimeout(()=>hint.classList.add('off'),11000);

function resize(){
  const r=cv.getBoundingClientRect(); W=Math.max(300,r.width); H=Math.max(400,r.height);
  DPR=Math.min(window.devicePixelRatio||1,2,Math.sqrt(2.6e6/(W*H))); DPR=Math.max(1,DPR);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); S=clamp(Math.min(W,H)/520,.8,1.35);
  buildStatic(); sizeFish(); fishes.forEach(k=>{ k.x=clamp(k.x,W*.08,W*.92); k.y=clamp(k.y,H*.12,H*.9); resetSpine(k); pickTarget(k,now); });
}
let last=performance.now(), slow=0, frames=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000); last=ts; now+=dt; const t=now;
  if(!lowQ&&++frames>40){ if(dt>.03) slow++; else slow=Math.max(0,slow-1); if(slow>35){ lowQ=true; buildStatic(); } }
  pxs+=(mx-pxs)*Math.min(1,dt*3); pys+=(my-pys)*Math.min(1,dt*3);
  cx.setTransform(DPR,0,0,DPR,0,0);
  cx.drawImage(bgC,0,0,W,H);
  drawCaustics(t); drawMoon(t,pxs,pys); drawLanterns(t,pxs,pys);
  fishes.slice().sort((a,b)=>a.y-b.y).forEach(k=>{ updateKoi(k,dt,t); drawKoi(k,t); });
  cx.fillStyle='rgba(6,70,110,.10)'; cx.fillRect(0,0,W,H);
  drawRipples(t); lilies.forEach(p=>drawLily(p,t,pxs,pys)); drawFoods(dt,t); drawPetals(dt,t,pxs,pys); drawDust(dt,t); drawSparks(dt);
  cx.drawImage(fgC,0,0,W,H);
  placeTags(dt); requestAnimationFrame(frame);
}
makeCaustics(); resize(); spawnFish(); buildTags();
addRipple(W*.5,H*.5,160*S,.5,'255,230,160'); addEventListener('resize',resize);
requestAnimationFrame(frame);
</script>
</body>
</html>
